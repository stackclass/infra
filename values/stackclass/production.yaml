frontend:
  ingress:
    enabled: true
    host: stackclass.dev
    tls:
      enabled: true
  secrets:
    analyticsId: "<REPLACE_WITH_ANALYTICS_ID>"
    githubClientId: "<REPLACE_WITH_GITHUB_CLIENT_ID>"
    githubClientSecret: "<REPLACE_WITH_GITHUB_CLIENT_SECRET>"

backend:
  ingress:
    hosts:
      api: api.stackclass.dev
      git: git.stackclass.dev
    tls:
      enabled: true
  secrets:
    gitProxyEndpoint: "https://git.stackclass.dev"
    gitServerEndpoint: "https://repo.stackclass.dev"
    gitServerUsername: "<REPLACE_WITH_GIT_SERVER_USERNAME>"
    gitServerPassword: "<REPLACE_WITH_GIT_SERVER_PASSWORD>"
    dockerRegistryEndpoint: "docker.stackclass.dev"
    dockerRegistryUsername: "<REPLACE_WITH_DOCKER_REGISTRY_USERNAME>"
    dockerRegistryPassword: "<REPLACE_WITH_DOCKER_REGISTRY_PASSWORD>"
    authSecret: "<REPLACE_WITH_AUTH_SECRET>"

postgresql:
  enabled: true
  auth:
    username: stackclass
    database: stackclass
    password: "<REPLACE_WITH_SC_DB_USERNAME>"

issuer:
  enabled: true
  email: "<REPLACE_WITH_ISSUER_EMAIL>"
  environment: "prod"
