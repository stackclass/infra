frontend:
  ingress:
    host: stackclass.local
  secrets:
    analyticsId: ""
    betterAuthSecret: "<REPLACE_WITH_BETTER_AUTH_SECRET>"
    githubClientId: "<REPLACE_WITH_GITHUB_CLIENT_ID>"
    githubClientSecret: "<REPLACE_WITH_GITHUB_CLIENT_SECRET>"

backend:
  ingress:
    hosts:
      api: api.stackclass.local
      git: git.stackclass.local
  secrets:
    gitProxyEndpoint: "http://git.stackclass.local"
    gitServerEndpoint: "http://repo.stackclass.local"
    gitServerUsername: "<REPLACE_WITH_GIT_SERVER_USERNAME>"
    gitServerPassword: "<REPLACE_WITH_GIT_SERVER_PASSWORD>"
    dockerRegistryEndpoint: "http://docker.stackclass.local"
    dockerRegistryUsername: "<REPLACE_WITH_DOCKER_REGISTRY_USERNAME>"
    dockerRegistryPassword: "<REPLACE_WITH_DOCKER_REGISTRY_PASSWORD>"
